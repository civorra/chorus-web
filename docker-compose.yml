# Native Compose secret: read directly from the host file at "up" time,
# never copied into this repo, never passed as a plain container env var
# (invisible via `docker inspect`). Mounted read-only in each service
# under /run/secrets/anthropic_api_key — see Dockerfile / eca-bootstrap.sh
# for the export to ANTHROPIC_API_KEY.
secrets:
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE}

services:
  eca-server:
    build:
      context: .
      dockerfile: Dockerfile.eca
    # ⚠️ Pas de `dns:` figé ici — abandonné après incident (2026-10-14).
    # Un premier incident (résolveur Docker embarqué 127.0.0.11 intermittent
    # pour les lookups applicatifs vers tls.eca.dev/models.dev/
    # api.business.githubcopilot.com, alors qu'une connexion TLS directe par
    # IP fonctionnait) avait été "corrigé" en figeant `dns: [1.1.1.1, 8.8.8.8]`.
    # Ce correctif casse la résolution DNS dès que le VPN d'entreprise est
    # actif sur l'hôte (route split-tunnel `0.0.0.0/1` + `128.0.0.0/1` via
    # tun0) : le VPN bloque/filtre spécifiquement les requêtes DNS directes
    # vers des résolveurs publics (ping 1.1.1.1 → 100% packet loss, alors que
    # curl HTTPS vers la même IP passe sans problème — seul le port 53 est
    # filtré), forçant l'usage de son propre résolveur interne
    # (192.168.212.24/23). Sans `dns:` explicite, le conteneur hérite du
    # résolveur de l'hôte via Docker (qui bascule correctement lui-même
    # entre DNS normal et DNS VPN selon le contexte réseau actif) — solution
    # robuste dans les deux cas (VPN actif ou non), contrairement à des IP
    # figées qui ne conviennent qu'à un seul des deux contextes.
    environment:
      - ECA_REMOTE_PASSWORD=${ECA_REMOTE_PASSWORD:-changeme-local-dev}
      # ── Provider LLM ──────────────────────────────────────────
      # Défaut : Anthropic Max (OAuth ECA / Emacs Pro/Max).
      # Pour GitHub Copilot Enterprise : surcharger dans .env
      # (voir section "LLM Provider" de .env.example).
      - ECA_DEFAULT_MODEL=${ECA_DEFAULT_MODEL:-anthropic/claude-sonnet-4-6}
      - ANTHROPIC_PROVIDER_TYPE=${ANTHROPIC_PROVIDER_TYPE:-max}
      - ECA_MODEL_ARCHITECT=${ECA_MODEL_ARCHITECT:-anthropic/claude-sonnet-5}
      - ECA_MODEL_CODE=${ECA_MODEL_CODE:-anthropic/claude-sonnet-4-6}
      - ECA_MODEL_FAST=${ECA_MODEL_FAST:-anthropic/claude-haiku-4-5-20251001}
    # No anthropic_api_key secret here: ECA uses OAuth credentials
    # (Pro/Max subscription) mounted from ~/.config/eca/ on the host.
    # API key fallback: eca-bootstrap.sh injects it automatically when
    # OAuth credentials are absent AND the secret is configured.
    volumes:
      # Same mount as chorus-web: ECA must see engine/AGENTS.md,
      # agent/skills/*.md and sandboxes/ to load the real skills.
      - ${CHORUS_HOME}:/chorus
      # ECA OAuth credentials (host Pro/Max session) — read-only.
      # La webapp n'écrit plus dans db.transit.json (OAuth natif Node.js
      # écrit dans .webapp-auth.json sur le volume /chorus).
      # - ${OAUTH_CREDENTIALS}:/root/.cache/eca/db.transit.json:ro
      # eca-config.json monté en volume : override du COPY Dockerfile.eca,
      # évite un rebuild pour changer de provider (Anthropic ↔ Copilot).
      - ./eca-config.json:/etc/eca/config.json:ro
    # No port published to the host — only chorus-web (internal Compose
    # network) needs to reach this service, via https://eca-server:7777.
    restart: unless-stopped

  chorus:
    build:
      # Context = Chorus repo root (parent de web/) — le Dockerfile peut
      # ainsi lire engine/Makefile.PL+lib/ pour la vérification de build,
      # et web/ pour les métadonnées npm (package.json).
      # Les fichiers serveur/frontend ne sont plus COPYés — ils arrivent
      # via le volume /chorus/web (voir § volumes ci-dessous).
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    secrets:
      - anthropic_api_key
    working_dir: /chorus/web
    environment:
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Racine commune Chorus — contient engine/ et web/ comme sous-dossiers.
      - CHORUS_HOME=/chorus
      # Chemins des deux repos (vus depuis le conteneur).
      - CHORUS_ENGINE_HOME=/chorus/engine
      - CHORUS_WEB_HOME=/chorus/web
      # Sandbox root — sous engine/.
      - SANDBOXES=${SANDBOXES:-/chorus/engine/sandboxes}
      # No PERL5LIB : modules Chorus::* installés via entrypoint make install.
      - PORT=3000
      # eca-server service (internal Compose network). HTTPS required —
      # the ECA remote server only listens over TLS (self-signed certificate
      # *.local.eca.dev, see eca-client.js § rejectUnauthorized: false).
      - ECA_SERVER_URL=https://eca-server:7777
      - ECA_REMOTE_PASSWORD=${ECA_REMOTE_PASSWORD:-changeme-local-dev}
      # Nom du conteneur eca-server (pour docker restart via socket).
      # Par défaut : <project>-eca-server-1 (nommage Compose automatique).
      - ECA_CONTAINER_NAME=${ECA_CONTAINER_NAME:-web-eca-server-1}
      # Dupliqué depuis le service eca-server — uniquement pour affichage
      # dans le panneau "Services" (GET /api/eca/info), lecture seule,
      # aucun impact sur le provider réellement utilisé par eca-server.
      - ECA_DEFAULT_MODEL=${ECA_DEFAULT_MODEL:-anthropic/claude-sonnet-4-6}
      - ANTHROPIC_PROVIDER_TYPE=${ANTHROPIC_PROVIDER_TYPE:-max}
      - ECA_MODEL_ARCHITECT=${ECA_MODEL_ARCHITECT:-anthropic/claude-sonnet-5}
      - ECA_MODEL_CODE=${ECA_MODEL_CODE:-anthropic/claude-sonnet-4-6}
      - ECA_MODEL_FAST=${ECA_MODEL_FAST:-anthropic/claude-haiku-4-5-20251001}
      # Chemin du socket Docker dans le conteneur (ne pas modifier sauf proxy)
      - DOCKER_SOCKET=/var/run/docker.sock
      # OAuth client IDs — défauts = client_ids ECA ; surcharger si OAuth App dédiée
      - ANTHROPIC_OAUTH_CLIENT_ID=${ANTHROPIC_OAUTH_CLIENT_ID:-9d1c250a-e61b-44d9-88ed-5944d1962f5e}
      - ANTHROPIC_OAUTH_SCOPE=${ANTHROPIC_OAUTH_SCOPE:-org:create_api_key user:profile user:inference}
      - COPILOT_OAUTH_CLIENT_ID=${COPILOT_OAUTH_CLIENT_ID:-Iv1.b507a08c87ecfe98}
    volumes:
      # ── Repos montés en volume (remplacent tous les bind-mounts fichier-par-fichier) ──
      # run.pl écrit dans engine/sandboxes/*/workspace/ → accès RW requis sur engine.
      - ${CHORUS_ENGINE_HOME:-${CHORUS_HOME}/engine}:/chorus/engine
      - ${CHORUS_WEB_HOME:-${CHORUS_HOME}/web}:/chorus/web
      # Volume nommé pour node_modules : empêche le montage /chorus/web de
      # masquer les dépendances npm installées au démarrage via l'entrypoint.
      # Premier `compose up` : vide → npm install le remplit (~30s).
      # `compose up` suivants : persisté → démarrage instantané.
      - node_modules_chorus:/chorus/web/node_modules
      # Docker socket — nécessaire pour /api/auth/reload-eca (restart eca-server).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - eca-server
    restart: unless-stopped

volumes:
  node_modules_chorus:
