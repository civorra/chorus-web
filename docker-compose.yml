# Native Compose secret: read directly from the host file at "up" time,
# never copied into this repo, never passed as a plain container env var
# (invisible via `docker inspect`). Mounted read-only in each service
# under /run/secrets/anthropic_api_key — see Dockerfile / eca-bootstrap.sh
# for the export to ANTHROPIC_API_KEY.
secrets:
  anthropic_api_key:
    file: /home/civ/.config/anthropic/api_key

services:
  eca-server:
    build:
      context: .
      dockerfile: Dockerfile.eca
    environment:
      - ECA_REMOTE_PASSWORD=${ECA_REMOTE_PASSWORD:-changeme-local-dev}
    # No anthropic_api_key secret here: ECA uses OAuth credentials
    # (Pro/Max subscription) mounted from ~/.config/eca/ on the host.
    # API key fallback: eca-bootstrap.sh injects it automatically when
    # OAuth credentials are absent AND the secret is configured.
    volumes:
      # Same mount as chorus-web: ECA must see Engine/AGENTS.md,
      # agent/skills/*.md and sandboxes/ to load the real skills.
      - ${CHORUS_HOME}:/chorus
      # ECA OAuth credentials (host Pro/Max session) — read-only.
      # ECA stores OAuth tokens in ~/.cache/eca/db.transit.json (not in
      # ~/.config/eca/). Mount only this file to avoid polluting the host
      # cache with the container's own session data.
      - /home/civ/.cache/eca/db.transit.json:/root/.cache/eca/db.transit.json:ro
    # No port published to the host — only chorus-web (internal Compose
    # network) needs to reach this service, via https://eca-server:7777.
    restart: unless-stopped

  chorus-web:
    build:
      # Context = Chorus repo root, so the Dockerfile can COPY Engine/
      # (Makefile.PL + lib/) and install the Chorus::* modules natively
      # via perl Makefile.PL && make && make install.
      # chorus-web is now a real directory (no longer a symlink to
      # chorus-mvp0-v43/) — BuildKit does not follow directory symlinks
      # when building the context, which broke COPY chorus-web/*.
      context: ..
      dockerfile: chorus-web/Dockerfile
    ports:
      - "3000:3000"
    secrets:
      - anthropic_api_key
    environment:
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Path as seen FROM THE CONTAINER (matches the volume mount point below),
      # never the host path — otherwise chorus.js/run.pl look for a non-existent directory.
      - CHORUS_HOME=/chorus
      # Sandbox root — separate from CHORUS_HOME to allow mounting the full
      # repo. Points to $CHORUS/sandboxes/cyber-sec (host path
      # /home/civ/Documents/DEV/Chorus/sandboxes/cyber-sec, seen from the
      # container via the ${CHORUS_HOME}:/chorus volume below).
      - SANDBOXES=${SANDBOXES:-/chorus/Engine/sandboxes}
      # No PERL5LIB: Chorus::* modules are installed natively in the image
      # via Makefile.PL/make install (see Dockerfile).
      - PORT=3000
      # eca-server service (internal Compose network). HTTPS required —
      # the ECA remote server only listens over TLS (self-signed certificate
      # *.local.eca.dev, see eca-client.js § rejectUnauthorized: false).
      - ECA_SERVER_URL=https://eca-server:7777
      - ECA_REMOTE_PASSWORD=${ECA_REMOTE_PASSWORD:-changeme-local-dev}
    volumes:
      # Mount the entire existing Chorus repo read-write
      # (run.pl writes reports under Engine/sandboxes/*/workspace/)
      - ${CHORUS_HOME}:/chorus
      # Bind-mount chorus-web.html so edits on the host sont visibles sans rebuild.
      - ./chorus-web.html:/app/chorus-web.html:ro
      - ./chorus.js:/app/chorus.js:ro
    depends_on:
      - eca-server
    restart: unless-stopped
